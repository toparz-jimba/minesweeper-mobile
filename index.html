<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="format-detection" content="telephone=no">
    <title>マインスイーパー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui-container">
        <header>
            <h1>マインスイーパー</h1>
            <div class="game-info">
                <div class="info-item">
                    <span class="label">💣</span>
                    <span id="mineCount">10</span>
                </div>
                <div class="info-item">
                    <span class="label">🚩</span>
                    <span id="flagCount">0</span>
                </div>
                <div class="info-item">
                    <span class="label">⏱</span>
                    <span id="timer">0</span>
                </div>
            </div>
            <button id="resetBtn" class="reset-btn">リセット 😊</button>
        </header>
        
        <div class="controls">
            <button id="easyBtn" class="difficulty-btn">簡単 (9×9)</button>
            <button id="mediumBtn" class="difficulty-btn active">普通 (16×16)</button>
            <button id="hardBtn" class="difficulty-btn">難しい (16×30)</button>
        </div>
    </div>
    
    <div class="board-container">
        <div class="board-viewport">
            <div id="gameBoard" class="game-board"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
