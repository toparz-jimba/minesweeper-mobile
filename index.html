<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="format-detection" content="telephone=no">
    <title>マインスイーパー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui-container">
        <header>
            <h1>マインスイーパー</h1>
            
            <div class="controls">
                <select id="difficultySelect" class="difficulty-select">
                    <option value="easy">簡単 (9×9)</option>
                    <option value="medium" selected>普通 (16×16)</option>
                    <option value="hard">難しい (16×30)</option>
                    <option value="backEasy">裏初級 (9×9)</option>
                    <option value="backMedium">裏中級 (16×16)</option>
                    <option value="backHard">裏上級 (16×30)</option>
                    <option value="extreme">極悪 (64×64)</option>
                </select>
            </div>
            
            <div class="game-info">
                <div class="info-item">
                    <span class="label">💣</span>
                    <span id="mineCount">10</span>
                </div>
                <div class="info-item flag-counter">
                    <span class="label">🚩</span>
                    <span id="flagCount">0</span>
                    <span class="flag-max">/<span id="maxFlags">10</span></span>
                </div>
                <div class="info-item">
                    <span class="label">⏱</span>
                    <span id="timer">0</span>
                </div>
                <button id="resetBtn" class="reset-btn">リセット 😊</button>
            </div>
        </header>
    </div>
    
    <div class="board-container">
        <div class="board-viewport">
            <div id="gameBoard" class="game-board"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
